<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/style.css">
    <title>Space Invaders</title>
</head>
<body>
    <section class="score-ui">
        <div>
            <span class="score">score: <span>0</span></span>
            <span class="level">level: <span>1</span></span>
            <span class="high">high: <span>0</span></span>
        </div>
    </section>

    <section class="start-screen screen">
        <div>
            <h1>Space Invaders</h1>
            <button class="button-play">Jogar</button>
            <button class="button-buy">Loja</button>

            <div class="skin-selection">
                <h2>Skin atual</h2>
                <div class="selected-skin-preview">
                    <span class="selected-skin-name">Padrão</span>
                </div>
                <div class="skin-options"></div>
            </div>
        </div>

        <span>manual do dev version</span>
    </section>

    <section class="game-over screen">
        <div>
            <h1>Game Over</h1>
            <button class="button-restart">Restart</button>
            <button class="button-home">Menu</button>
        </div>
    </section>

    <section class="store-screen screen hidden">
        <div class="store-panel">
            <div class="store-header">
                <h1>Loja de Skins</h1>
                <button class="button-close-store">Fechar</button>
            </div>
            <div class="store-items"></div>
            <span class="store-hint">Compre skins de teste e selecione a favorita no menu.</span>
        </div>
    </section>

    <canvas></canvas>

    <script type="module" src="src/main.js"></script>
</body>
</html>
